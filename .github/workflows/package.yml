name: Workspace metadata package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - name: Build the standalone wheel and source archive
        run: uv build --sdist --wheel --out-dir "$RUNNER_TEMP/workspaces-dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspaces-distributions
          path: ${{ runner.temp }}/workspaces-dist/*
          if-no-files-found: error

  installed:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workspaces-distributions
          path: ${{ runner.temp }}/workspaces-dist
      - name: Test the installed wheel outside the source checkout
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          uv venv --python 3.13 "$RUNNER_TEMP/workspaces-installed"
          python_path="$RUNNER_TEMP/workspaces-installed/bin/python"
          uv pip install --python "$python_path" "$RUNNER_TEMP/workspaces-dist/amplifier_workspace_metadata-$version-py3-none-any.whl[test]"
          mkdir "$RUNNER_TEMP/workspaces-tests"
          git archive HEAD tests pyproject.toml | (cd "$RUNNER_TEMP/workspaces-tests" && tar -x)
          cd "$RUNNER_TEMP/workspaces-tests"
          "$python_path" -I -c 'from pathlib import Path; import sys, amplifier_workspace_metadata; assert Path(amplifier_workspace_metadata.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert not any(name in sys.modules for name in ("amplifier_web", "amplifier_core", "amplifier_foundation"))'
          "$python_path" -I -m pytest -q tests --junitxml=installed-tests.xml
          uv pip check --python "$python_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workspaces-installed-linux
          path: ${{ runner.temp }}/workspaces-tests/installed-tests.xml
          if-no-files-found: error
